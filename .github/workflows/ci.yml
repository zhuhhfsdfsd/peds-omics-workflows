name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test MR workflow
        run: python -m peds_omics_workflows.cli mr --input data/example/mr_instruments.csv --output /tmp/mr_summary.json
      - name: Smoke-test single-cell QC workflow
        run: python -m peds_omics_workflows.cli scrna-qc --input data/example/scrna_cells.csv --output /tmp/scrna_qc_summary.json
      - name: Smoke-test pseudobulk workflow
        run: python -m peds_omics_workflows.cli pseudobulk --input data/example/pseudobulk_counts.csv --output /tmp/pseudobulk_counts.csv
